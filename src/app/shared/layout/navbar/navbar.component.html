<p-menubar [model]="menuItems">
  <ng-template pTemplate="start">
    <span class="brand-title">📈 StockMarket</span>
  </ng-template>
  <ng-template pTemplate="end">
    <div class="flex align-items-center gap-2">
      <span class="text-sm text-color-secondary">{{ (currentUser$ | async)?.displayName || (currentUser$ | async)?.userName }}</span>

      <!-- Portfolio review notification bell -->
      <p-button
        icon="pi pi-bell"
        [badge]="unreadCount() > 0 ? unreadCount().toString() : ''"
        badgeSeverity="danger"
        severity="secondary"
        [text]="true"
        size="small"
        pTooltip="Portfolio review notifications"
        (onClick)="openReview()"
      />

      <p-button
        [icon]="themeService.isDark() ? 'pi pi-sun' : 'pi pi-moon'"
        [pTooltip]="themeService.isDark() ? 'Switch to light mode' : 'Switch to dark mode'"
        severity="secondary"
        [text]="true"
        size="small"
        (onClick)="themeService.toggle()"
      />
      <p-button label="Logout" severity="secondary" size="small" (onClick)="onLogout()" />
    </div>
  </ng-template>
</p-menubar>

<app-portfolio-review-modal
  [visible]="reviewModalVisible()"
  (visibleChange)="reviewModalVisible.set($event)"
  [review]="latestReview()"
/>
