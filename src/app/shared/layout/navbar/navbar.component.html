<p-menubar [model]="menuItems">
  <ng-template pTemplate="start">
    <span class="brand-title">📈 StockMarket</span>
  </ng-template>
  <ng-template pTemplate="end">
    <div class="flex align-items-center gap-2">
      <span class="text-sm text-color-secondary">{{ (currentUser$ | async)?.userName }}</span>
      <p-button
        [icon]="themeService.isDark() ? 'pi pi-sun' : 'pi pi-moon'"
        [pTooltip]="themeService.isDark() ? 'Switch to light mode' : 'Switch to dark mode'"
        severity="secondary"
        [text]="true"
        size="small"
        (onClick)="themeService.toggle()"
      />
      <p-button label="Logout" severity="secondary" size="small" (onClick)="onLogout()" />
    </div>
  </ng-template>
</p-menubar>
