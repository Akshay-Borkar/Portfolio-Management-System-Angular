<mat-toolbar class="navbar">
  <span class="brand-title">📈 StockMarket</span>

  <nav class="nav-links">
    @for (item of navItems; track item.route) {
      <a mat-button [routerLink]="item.route" routerLinkActive="active-link">
        <mat-icon>{{ item.icon }}</mat-icon>
        {{ item.label }}
      </a>
    }
  </nav>

  <button
    mat-icon-button
    class="nav-hamburger"
    [matMenuTriggerFor]="mobileMenu"
    aria-label="Open navigation menu"
  >
    <mat-icon>menu</mat-icon>
  </button>
  <mat-menu #mobileMenu="matMenu">
    @for (item of navItems; track item.route) {
      <a mat-menu-item [routerLink]="item.route">
        <mat-icon>{{ item.icon }}</mat-icon>
        <span>{{ item.label }}</span>
      </a>
    }
  </mat-menu>

  <span class="spacer"></span>

  <span class="user-name text-sm text-color-secondary">
    {{ (currentUser$ | async)?.displayName || (currentUser$ | async)?.userName }}
  </span>

  <button
    mat-icon-button
    matTooltip="Portfolio review notifications"
    [matBadge]="unreadCount() > 0 ? unreadCount().toString() : ''"
    [matBadgeHidden]="unreadCount() === 0"
    matBadgeColor="warn"
    matBadgeSize="small"
    (click)="openReview()"
  >
    <mat-icon>notifications</mat-icon>
  </button>

  <button
    mat-icon-button
    [matTooltip]="themeService.isDark() ? 'Switch to light mode' : 'Switch to dark mode'"
    (click)="themeService.toggle()"
  >
    <mat-icon>{{ themeService.isDark() ? 'light_mode' : 'dark_mode' }}</mat-icon>
  </button>

  <button mat-stroked-button (click)="onLogout()">Logout</button>
</mat-toolbar>
