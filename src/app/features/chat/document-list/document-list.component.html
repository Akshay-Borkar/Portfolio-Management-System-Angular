<div class="list-section">
  <div class="section-header">
    <div class="section-label">
      <mat-icon>database</mat-icon>
      <span>Indexed Documents</span>
    </div>
    <button
      mat-icon-button
      class="refresh-btn"
      [class.spin]="loading()"
      (click)="load()"
      matTooltip="Refresh list"
      matTooltipPosition="left"
    >
      <mat-icon>refresh</mat-icon>
    </button>
  </div>

  @if (loading()) {
    <div class="skeleton-list">
      <app-skeleton height="1.6rem" class="block mb-1" />
      <app-skeleton height="1.6rem" width="80%" class="block mb-1" />
      <app-skeleton height="1.6rem" width="65%" />
    </div>
  } @else if (error()) {
    <p class="list-notice error">Failed to load. <button class="link-btn" (click)="load()">Retry</button></p>
  } @else if (documents().length === 0) {
    <p class="list-notice">No documents indexed yet.</p>
  } @else {
    <ul class="doc-list">
      @for (doc of documents(); track doc) {
        <li class="doc-item">
          <mat-icon class="doc-icon">picture_as_pdf</mat-icon>
          <span class="doc-name" [title]="doc">{{ doc }}</span>
        </li>
      }
    </ul>
  }
</div>
