<div class="list-section">
  <div class="section-header">
    <div class="section-label">
      <i class="pi pi-database"></i>
      <span>Indexed Documents</span>
    </div>
    <button
      class="refresh-btn"
      pButton
      icon="pi pi-refresh"
      [class.spin]="loading()"
      (click)="load()"
      pTooltip="Refresh list"
      tooltipPosition="left"
      [text]="true"
      [rounded]="true"
      size="small"
    ></button>
  </div>

  @if (loading()) {
    <div class="skeleton-list">
      <p-skeleton height="1.6rem" styleClass="mb-1" />
      <p-skeleton height="1.6rem" width="80%" styleClass="mb-1" />
      <p-skeleton height="1.6rem" width="65%" />
    </div>
  } @else if (error()) {
    <p class="list-notice error">Failed to load. <button class="link-btn" (click)="load()">Retry</button></p>
  } @else if (documents().length === 0) {
    <p class="list-notice">No documents indexed yet.</p>
  } @else {
    <ul class="doc-list">
      @for (doc of documents(); track doc) {
        <li class="doc-item">
          <i class="pi pi-file-pdf doc-icon"></i>
          <span class="doc-name" [title]="doc">{{ doc }}</span>
        </li>
      }
    </ul>
  }
</div>
