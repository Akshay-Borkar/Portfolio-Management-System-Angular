<h2 mat-dialog-title>Weekly Portfolio Review</h2>

<mat-dialog-content>
  @if (review) {
    <div class="review-meta mb-3">
      <span class="text-sm text-color-secondary">
        Generated: {{ review.generatedAt | date:'medium' }}
      </span>
    </div>

    <mat-card class="review-section mb-3" appearance="outlined">
      <div class="review-section-header news">
        <mat-icon>newspaper</mat-icon>
        <span>News Summary</span>
      </div>
      <mat-card-content>
        <div class="review-content" [innerHTML]="review.newsSummary | markdown"></div>
      </mat-card-content>
    </mat-card>

    <mat-card class="review-section mb-3" appearance="outlined">
      <div class="review-section-header risk">
        <mat-icon>warning</mat-icon>
        <span>Risk Analysis</span>
      </div>
      <mat-card-content>
        <div class="review-content" [innerHTML]="review.riskAnalysis | markdown"></div>
      </mat-card-content>
    </mat-card>

    <mat-card class="review-section" appearance="outlined">
      <div class="review-section-header recommendation">
        <mat-icon>lightbulb</mat-icon>
        <span>Weekly Recommendation</span>
      </div>
      <mat-card-content>
        <div class="review-content" [innerHTML]="review.weeklyRecommendation | markdown"></div>
      </mat-card-content>
    </mat-card>
  } @else {
    <div class="flex justify-content-center align-items-center" style="min-height: 200px;">
      <mat-progress-spinner mode="indeterminate" diameter="44" />
    </div>
  }
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="close()">Close</button>
</mat-dialog-actions>
