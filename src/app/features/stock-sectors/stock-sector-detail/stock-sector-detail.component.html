<div class="mb-3">
  <button mat-stroked-button routerLink="/sectors">
    <mat-icon>chevron_left</mat-icon>
    Back to Sectors
  </button>
</div>

@if (loading$ | async) {
  <div class="flex justify-content-center py-5"><mat-progress-spinner mode="indeterminate" diameter="44" /></div>
}

@if (error$ | async; as err) {
  <app-inline-message severity="error" [text]="err" class="block mb-3" />
}

@if (sector$ | async; as sector) {
  <mat-card appearance="outlined">
    <mat-card-header>
      <mat-card-title>{{ sector.stockSectorName }}</mat-card-title>
      <mat-card-subtitle>
        Created: {{ sector.dateCreated | date:'medium' }} &nbsp;|&nbsp;
        Modified: {{ sector.dateModified | date:'medium' }}
      </mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="onSave()">
        <div class="form-fields">
          <mat-form-field appearance="outline">
            <mat-label>Sector Name</mat-label>
            <input matInput formControlName="stockSectorName" />
          </mat-form-field>
          <mat-form-field appearance="outline">
            <mat-label>Sector P/E</mat-label>
            <input matInput type="number" formControlName="sectorPE" />
          </mat-form-field>
          <div class="flex gap-2">
            <button mat-flat-button color="primary" type="submit" [disabled]="form.invalid || form.pristine">
              Save Changes
            </button>
          </div>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
}
