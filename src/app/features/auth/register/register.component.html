<div class="register-wrapper">
  <mat-card class="register-card" appearance="outlined">
    <mat-card-header>
      <mat-card-title>Create Account</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <div class="flex flex-column gap-2">
          <div class="flex gap-2">
            <mat-form-field appearance="outline" class="flex-1">
              <mat-label>First Name</mat-label>
              <input matInput formControlName="firstName" placeholder="First name" />
            </mat-form-field>
            <mat-form-field appearance="outline" class="flex-1">
              <mat-label>Last Name</mat-label>
              <input matInput formControlName="lastName" placeholder="Last name" />
            </mat-form-field>
          </div>

          <mat-form-field appearance="outline">
            <mat-label>Email</mat-label>
            <input matInput formControlName="email" type="email" placeholder="Email" />
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Username</mat-label>
            <input matInput formControlName="userName" placeholder="Username (min 6 chars)" />
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Password</mat-label>
            <input matInput [type]="hidePassword ? 'password' : 'text'" formControlName="password" placeholder="Password (min 6 chars)" />
            <button
              mat-icon-button
              matSuffix
              type="button"
              (click)="hidePassword = !hidePassword"
              [attr.aria-label]="hidePassword ? 'Show password' : 'Hide password'"
            >
              <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
            </button>
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Role</mat-label>
            <mat-select formControlName="role">
              @for (role of roles; track role) {
                <mat-option [value]="role">{{ role }}</mat-option>
              }
            </mat-select>
          </mat-form-field>

          @if (error$ | async; as err) {
            <app-inline-message severity="error" [text]="err" />
          }

          <button
            mat-flat-button
            color="primary"
            type="submit"
            class="w-full"
            [disabled]="form.invalid || !!(loading$ | async)"
          >
            Register
          </button>

          <span class="text-center text-sm">
            Have an account? <a routerLink="/login">Sign in</a>
          </span>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
